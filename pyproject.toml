[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "molt-local-automation"
version = "0.4.0"
description = "Local-first verified CSV automation with an optional Ollama recipe compiler"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
telemetry = ["sentry-sdk>=2.0"]
anomaly = ["tabpfn"]
temporal = ["temporalio>=1.7"]

[tool.setuptools.packages.find]
include = ["molt*"]
