<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 530" role="img" aria-labelledby="title desc">
<title id="title">Molt: a model proposes, tests decide</title>
<desc id="desc">Conceptual lifecycle diagram, not a dashboard capture. Teach a task, generate a constrained recipe, verify, approve, reuse with zero model calls. Drift blocks execution; repairs require regression and approval.</desc>
<rect width="1200" height="530" rx="24" fill="#101827"/>
<g font-family="Arial, sans-serif" fill="#f6f7fb">
<text x="52" y="70" font-size="34" font-weight="bold">MOLT — a model proposes. Tests decide.</text>
<text x="52" y="108" font-size="19" fill="#bbc8dc">Compile once. Verify against truth. Reuse without repeated inference.</text>
<g stroke="#799abd" stroke-width="2" fill="#21354b">
<rect x="45" y="160" width="185" height="98" rx="12"/>
<rect x="275" y="160" width="185" height="98" rx="12"/>
<rect x="505" y="160" width="185" height="98" rx="12"/>
<rect x="735" y="160" width="185" height="98" rx="12"/>
<rect x="965" y="160" width="190" height="98" rx="12"/>
</g>
<g font-size="22" text-anchor="middle">
<text x="137" y="202">Teach</text><text x="137" y="232" font-size="16">Task + examples</text>
<text x="367" y="202">Gemma proposes</text><text x="367" y="232" font-size="16">Constrained JSON</text>
<text x="597" y="202">Tests decide</text><text x="597" y="232" font-size="16">Reject failures</text>
<text x="827" y="202">Approval gate</text><text x="827" y="232" font-size="16">Review before activation</text>
<text x="1060" y="202">Reuse</text><text x="1060" y="232" font-size="16">0 execution model calls</text>
<text x="252" y="215">→</text><text x="482" y="215">→</text><text x="712" y="215">→</text><text x="942" y="215">→</text>
</g>
<rect x="275" y="330" width="880" height="105" rx="12" fill="#352b29" stroke="#e3af7b" stroke-width="2"/>
<text x="310" y="372" font-size="24">Drift → block + quarantine → repair candidate</text>
<text x="310" y="406" font-size="20">Full regression and explicit approval required before activation.</text>
<text x="52" y="490" font-size="16" fill="#bbc8dc">Conceptual diagram • live Gemma trim proof and fixture drift/repair are separate evidence runs.</text>
</g></svg>
